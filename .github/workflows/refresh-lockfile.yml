name: Refresh lockfile

on:
  push:
    branches:
      - fix/gudform-oss-sync
    paths:
      - ".github/workflows/refresh-lockfile.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install and write lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile and remove this workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-lockfile.yml
          git add pnpm-lock.yaml .github/workflows/refresh-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh pnpm lockfile"
          git push
