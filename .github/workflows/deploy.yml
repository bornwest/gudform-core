name: Deploy

on:
  push:
    branches: [ bw-main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: false

jobs:
  build:
    runs-on: ubuntu
    steps:
      - uses: actions/checkout@v3
      - run: pnpm install
      - run: pnpm build
      - run: pm2 restart forms
