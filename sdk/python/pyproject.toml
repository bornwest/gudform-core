[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gudform"
version = "1.2.0"
description = "Official Python SDK for the GudForm API"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["gudform", "forms", "api", "sdk", "survey"]

[project.urls]
Homepage = "https://gudform.com"
Documentation = "https://gudform.com/docs"
Repository = "https://github.com/gudlab/gudform-core"
"Bug Tracker" = "https://github.com/gudlab/gudform-core/issues"

[tool.setuptools]
packages = ["gudform"]
